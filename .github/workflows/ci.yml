name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.13 runs on Java 17-23; 21 is the long-term choice for AGP 8.x.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and lint
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lint

      # The desk's own pure code, tested without a browser. `geometry.mjs`, `wire.mjs`, `glow.mjs`,
      # `camera.mjs` and `words.mjs` are pure so that it can be: the undo stack behind Ctrl+Z, the tolerance
      # a click has to be inside, the exact numbers a snapped vertex takes, which of the two drawing shapes a
      # save carries, what the mark under a picked-out track is made of, which remembered view may be
      # believed, and what the page calls a kind the phone has learned since - all arithmetic and rules, and
      # node runs the very files the browser does. The glob is deliberate, so a new file of them is picked up
      # by being written.
      - name: Unit test the desk's own code
        run: node --test app/src/test/js/*.test.mjs

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html

      # Debug builds are split by ABI as well; the universal one runs anywhere,
      # which is what a debug artifact is for.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sprayday-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk

  # The unit-test job above is fast and runs on every push. This one boots an
  # emulator so the instrumented tests (Room, migrations, view-model signals,
  # offline downloads) are actually covered - a regression like "the draw screen
  # closes on the second visit" only shows up at this level.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the emulator usable rather than glacial.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          if-no-files-found: ignore
          path: app/build/reports/androidTests/connected

