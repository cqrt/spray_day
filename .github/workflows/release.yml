name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${TAG#v}" >> "${GITHUB_OUTPUT}"

      # The keystore is a base64 blob in a secret: no key material lives in the repo.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set, so the build cannot be signed"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build the signed APK and app bundle
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      # A release that is not actually signed is worse than no release.
      - name: Verify the APK signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "verifying ${apk}"
            "${APKSIGNER}" verify --print-certs "${apk}"
          done

      # The release carries one small APK per architecture plus a universal one, so
      # nobody has to download four sets of native libraries to get the one their
      # phone needs.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Spray Day ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
