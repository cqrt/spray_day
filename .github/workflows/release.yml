name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          # versionCode comes from the version itself rather than the workflow's run
          # number: 0.2.1 -> 201. Run numbers are unpredictable and can end up *below*
          # a locally built test APK, which Android then refuses to install over.
          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR="$(echo "${VERSION}" | cut -d. -f2)"
          PATCH="$(echo "${VERSION}" | cut -d. -f3)"
          # Exactly three numeric parts: a short or long tag would otherwise collide
          # with a released version code without saying so.
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${TAG} is not in the form v<major>.<minor>.<patch>"
            exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "code=${CODE}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG} as versionName ${VERSION}, versionCode ${CODE}"

      # The keystore is a base64 blob in a secret: no key material lives in the repo.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set, so the build cannot be signed"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      # Two invocations on purpose: ABI splits and the app bundle cannot both be
      # built at once while resources are shrunk (AGP issue 402800800), so the
      # bundle is built with -PnoAbiSplits. The bundle does not need them - Play
      # splits by ABI itself.
      - name: Build the signed APKs
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Build the app bundle
        env:
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease -PnoAbiSplits \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      # A release that is not actually signed is worse than no release.
      - name: Verify the APK signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "verifying ${apk}"
            "${APKSIGNER}" verify --print-certs "${apk}"
          done

      # The release carries one small APK per architecture plus a universal one, so
      # nobody has to download four sets of native libraries to get the one their
      # phone needs. The assets are renamed to say what they are: a release page is
      # read on a phone, where "app-arm64-v8a-release.apk" tells you nothing.
      - name: Name the artifacts for the release page
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK_DIR=app/build/outputs/apk/release
          BUNDLE_DIR=app/build/outputs/bundle/release
          for apk in "${APK_DIR}"/*.apk; do
            name="$(basename "${apk}")"
            variant="${name#app-}"
            variant="${variant%-release.apk}"
            cp "${apk}" "${APK_DIR}/spray-day-${VERSION}-${variant}.apk"
          done
          cp "${BUNDLE_DIR}/app-release.aab" "${BUNDLE_DIR}/spray-day-${VERSION}.aab"
          ls -la "${APK_DIR}" "${BUNDLE_DIR}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Spray Day ${{ steps.version.outputs.name }}
          generate_release_notes: true
          body: |
            **Which file to install:** `spray-day-${{ steps.version.outputs.name }}-arm64-v8a.apk`
            for any phone from the last few years. The `universal` APK runs anywhere but is
            four times the size; `x86_64` is only for emulators.

            Signed with the same key as previous releases, so it installs straight over
            an existing install.
          files: |
            app/build/outputs/apk/release/spray-day-*.apk
            app/build/outputs/bundle/release/spray-day-*.aab
