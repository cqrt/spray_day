<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spray Day - the work</title>
  <!--
    The page's own files are loaded by the script at the end of the body, not by tags written here,
    because every request the phone answers needs the token and the token is in the address the
    operator opened. A browser asks for a stylesheet or a script with no query unless it is told
    otherwise, and a request without the token is a 403 - which looks like a page of unstyled text
    with nothing on it, the exact failure the script exists to prevent.

    MapLibre GL JS is vendored rather than pulled from a CDN: the page is served by the phone over
    the farm's own Wi-Fi, so it has to work with the internet down, and nothing from a third party
    should be running inside a page that can see the operator's own database. The version is pinned
    in vendor/, with its licence beside it.
  -->
</head>
<body>
  <header id="bar">
    <span id="title">Spray Day - the work</span>
    <span id="subtitle">Served by the phone. The details you save here are saved on the phone.</span>
  </header>

  <p id="notice" hidden></p>

  <!--
    What the drawing mode is doing, in the page's own words, because it is the page's own furniture:
    the phone's words are for what the phone decided, and this is only how to work the map.
  -->
  <p id="drawing" hidden>
    <span id="drawing-words"></span>
    <span id="drawing-buttons">
      <button id="drawing-side-track" type="button" hidden>Side track</button>
      <button id="drawing-back" type="button" hidden>Back to the track</button>
      <button id="drawing-drop" type="button" hidden>Remove this side track</button>
    </span>
  </p>

  <main>
    <aside id="side">
      <div id="side-actions">
        <!-- Off until the map has its style: a drawing needs somewhere to be drawn. -->
        <button id="draw" type="button" disabled>Draw a new track</button>
      </div>
      <input id="search" type="search" placeholder="Find a track or block" autocomplete="off">
      <div id="list" aria-live="polite"></div>
    </aside>
    <div id="map"></div>
  </main>

  <section id="card" hidden>
    <button id="card-close" type="button" aria-label="Close">&times;</button>
    <h2 id="card-name"></h2>
    <p id="card-due"></p>
    <dl id="card-facts"></dl>
    <div id="card-actions">
      <button id="card-edit" type="button">Change the details</button>
      <button id="card-shape" type="button">Change the shape</button>
    </div>

    <!--
      Deleting from the desk, with the phone's own sentence about what is on the track shown first: the
      count, and whether this is even something the desk may do. The button is off when the phone says
      the delete belongs there, so the operator is told why before pressing anything rather than after.
    -->
    <div id="card-remove-row">
      <p id="card-remove-words"></p>
      <button id="card-remove" type="button">Delete it</button>
    </div>
  </section>

  <!--
    The details form: the phone's own edit form, field for field. Its options and the sentences under
    them arrive in the state document, from the phone's phrase tables, so the desk offers the words
    the phone offers and cannot offer a choice the phone would refuse. The block field offers the
    blocks that exist, because typing a block's name again is how a misspelling becomes a new block.
  -->
  <section id="edit" hidden>
    <form id="edit-form">
      <button id="edit-close" type="button" aria-label="Close">&times;</button>
      <h2 id="edit-title">Change the details</h2>

      <label for="edit-name">Name</label>
      <input id="edit-name" type="text" autocomplete="off">

      <label for="edit-block">Block or group</label>
      <input id="edit-block" type="text" autocomplete="off" list="edit-blocks">
      <datalist id="edit-blocks"></datalist>
      <p class="hint" id="edit-block-hint"></p>

      <span class="label">What it is</span>
      <div class="choices" id="edit-kind" role="radiogroup" aria-label="What it is"></div>

      <div id="edit-shape-row" hidden>
        <span class="label">Shape</span>
        <div class="choices" id="edit-shape" role="radiogroup" aria-label="Shape"></div>
      </div>

      <label for="edit-interval">Days between sprays</label>
      <input id="edit-interval" type="text" inputmode="numeric" autocomplete="off">

      <span class="label">Spray method</span>
      <div class="choices" id="edit-method" role="radiogroup" aria-label="Spray method"></div>

      <label for="edit-swath">Swath width (m)</label>
      <input id="edit-swath" type="text" inputmode="decimal" autocomplete="off">
      <p class="hint" id="edit-swath-hint"></p>

      <span class="label">Passes to finish it</span>
      <div class="choices" id="edit-passes" role="radiogroup" aria-label="Passes to finish it"></div>

      <div id="edit-separation-row" hidden>
        <label for="edit-separation">Two passes about (m) apart</label>
        <input id="edit-separation" type="text" inputmode="decimal" autocomplete="off">
        <p class="hint" id="edit-separation-hint"></p>
      </div>

      <label for="edit-notes">Notes</label>
      <textarea id="edit-notes" rows="3"></textarea>

      <p id="edit-words" hidden></p>
      <div id="edit-buttons">
        <button id="edit-save" type="submit">Save to the phone</button>
        <button id="edit-cancel" type="button">Cancel</button>
      </div>
    </form>
  </section>

  <button id="locate" type="button" title="Ask the phone where it is">Where is the phone?</button>

  <script>
    (function () {
      var token = new URLSearchParams(location.search).get('k') || '';
      var head = document.head;

      // The token goes onto every URL this page asks for, because a browser asks for a stylesheet or a
      // script with no query unless it is told otherwise and the phone's gate answers nothing without
      // one. A phone that is serving with **no** token asks for nothing, so the suffix is empty and
      // every URL is the plain one.
      //
      // Nothing here checks for a missing token any more, and that is deliberate: the gate is
      // upstream, so a page that was served at all was either carrying the right token or asking a
      // phone that wants none. A check here could only be wrong about one of those two.
      var suffix = token ? '?k=' + encodeURIComponent(token) : '';

      function stylesheet(href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href + suffix;
        head.appendChild(link);
      }

      function script(src, onload) {
        var element = document.createElement('script');
        element.src = src + suffix;
        if (onload) element.onload = onload;
        head.appendChild(element);
      }

      stylesheet('vendor/maplibre-gl.css');
      stylesheet('style.css');

      // The page's own module runs once the map library is there, because it uses it.
      script('vendor/maplibre-gl.js', function () {
        var app = document.createElement('script');
        app.type = 'module';
        app.src = 'app.js' + suffix;
        head.appendChild(app);
      });
    })();
  </script>
</body>
</html>
