# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
#
# NOTE: the Gradle daemon JVM for this machine is pinned to JDK 23 in the
# user-level file ~/.gradle/gradle.properties (org.gradle.java.home), because
# Gradle 8.13 cannot run on the JBR 25 that Android Studio 2026.1.4 bundles.
# It is deliberately NOT set here so CI (which provides its own JDK) is unaffected.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Only include the R class entries a library declares, not its dependencies'
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official
