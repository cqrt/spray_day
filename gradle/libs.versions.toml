[versions]
# Toolchain - Gradle 8.13 wrapper pairs with AGP 8.12.0 and Kotlin 2.2.10,
# and must run on JDK 17-23 (see ~/.gradle/gradle.properties on this machine).
agp = "8.12.0"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeCompiler = "2.2.10"

# AndroidX / Compose
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.12.0"
composeBom = "2025.08.00"
# Material 3 Expressive is split in two, and this project can only have half of it:
#
# - the expressive *components* (ShortNavigationBar, ButtonGroup, LoadingIndicator,
#   FloatingActionButtonMenu) are public behind @OptIn(ExperimentalMaterial3ExpressiveApi)
#   and work on this toolchain, so they are used.
# - the expressive *theme and motion* (MaterialExpressiveTheme, MotionScheme) are declared
#   `internal` in the stable artifact - MaterialThemeKt ships them, but app code cannot
#   reference them - and are only public from material3 1.5.0-alpha, which requires
#   compileSdk 37 and AGP 9.1.0 (this project is compileSdk 36 on AGP 8.12.0).
#
# So this stays on the newest stable, and the expressive theme and motion arrive with the
# toolchain upgrade rather than ahead of it.
material3 = "1.4.0"
activityCompose = "1.10.1"
navigation = "2.9.3"
lifecycle = "2.9.2"
room = "2.7.2"
datastore = "1.1.7"

# Background work: due reminders must survive reboots and Doze, which is what
# WorkManager is for. AlarmManager would need its own boot receiver to do the same.
work = "2.11.2"

# Backup files are JSON. Written by hand this would mean writing a parser for the
# operator's only copy of their records, so the format gets a real library.
serialization = "1.11.0"

# Mapping / location
maplibre = "13.6.1"
playServicesLocation = "21.4.0"

# Testing
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Background work
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Backup format
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Mapping / location
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
